name: Refresh USDA summer meals

on:
  schedule:
    # USDA says the site finder is updated weekly during summer. Refresh Saturday
    # after Friday publishing, from preseason loading through seasonal closeout.
    - cron: '47 10 * 5-10 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-national-directory
  cancel-in-progress: false

jobs:
  refresh-usda-summer-meals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require scoped Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a repository secret and CLOUDFLARE_ACCOUNT_ID as a repository variable."
            exit 1
          fi

      - run: npm ci

      - name: Resolve, normalize, and validate the official USDA layer
        shell: bash
        run: |
          npm run --silent directory:ingest:usda-summer-meals -- \
            --output="$RUNNER_TEMP/usda-summer-meals.sql" \
            > "$RUNNER_TEMP/usda-summer-meals-summary.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/usda-summer-meals-summary.json', 'utf8')
          );
          if (summary.totalPublished < 30_000 || summary.totalPublished > 100_000) {
            throw new Error(`USDA safety gate failed: ${summary.totalPublished} published rows.`);
          }
          if (summary.imported < 30_000 || summary.imported > 80_000) {
            throw new Error(`USDA safety gate failed: ${summary.imported} normalized sites.`);
          }
          if (summary.stateCount < 45) {
            throw new Error(`USDA safety gate failed: only ${summary.stateCount} state/territory codes.`);
          }
          if (!/Summer Meals Site Finder \d{4}/i.test(summary.itemTitle ?? '')) {
            throw new Error(`USDA safety gate failed: unexpected app title "${summary.itemTitle}".`);
          }
          const month = new Date(summary.asOf + 'T12:00:00Z').getUTCMonth() + 1;
          if (month >= 6 && month <= 8 && summary.activeOnAsOf < 1_000) {
            throw new Error(
              `USDA safety gate failed: only ${summary.activeOnAsOf} sites active during summer.`
            );
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Apply database migrations
        run: >
          npx wrangler d1 migrations apply hearth-directory
          --remote
          --config worker/wrangler.jsonc

      - name: Apply the validated seasonal refresh to production D1
        run: >
          npx wrangler d1 execute hearth-directory
          --remote
          --config worker/wrangler.jsonc
          --file "$RUNNER_TEMP/usda-summer-meals.sql"

      - name: Verify source counts and current food search
        run: npm run check:production
